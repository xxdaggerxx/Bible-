# Checks the iPad and iPhone app builds (PLAT-9): links the shared Kotlin app for iOS and builds the
# Xcode project for the simulator, on GitHub's Mac runners. Nothing is signed or published yet:
# TestFlight needs the owner's Apple Developer account.
name: iOS build

on:
  push:
    branches: ["**"]
    paths:
      - shared/**
      - iosApp/**
      - app/build.gradle.kts
      - .github/workflows/ios.yml
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build for the simulator
        run: |
          chmod +x gradlew
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build | tail -n 80
          exit ${PIPESTATUS[0]}
