# Checks the iPad and iPhone app builds (PLAT-9): links the shared Kotlin app for iOS and builds the
# Xcode project for the simulator, on GitHub's Mac runners. Nothing is signed or published yet:
# TestFlight needs the owner's Apple Developer account.
name: iOS build

on:
  push:
    branches: ["**"]
    paths:
      - shared/**
      - iosApp/**
      - app/build.gradle.kts
      - .github/workflows/ios.yml
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build for the simulator
        run: |
          chmod +x gradlew
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build | tail -n 80
          exit ${PIPESTATUS[0]}

      - name: Run it on an iPad simulator
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/*.app" -maxdepth 6 -type d | head -1)
          echo "App: $app"
          device=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPad' in x['name']]
          print(ids[-1])")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          mkdir -p sim
          xcrun simctl spawn "$device" log stream --level debug --predicate 'process == "Ink & Word"' > sim/log.txt 2>&1 &
          # The app's own output (Kotlin prints an uncaught exception here).
          xcrun simctl launch --stdout="$PWD/sim/stdout.txt" --stderr="$PWD/sim/stderr.txt" "$device" com.biblestudy.app
          # The first start unpacks the Bibles and commentaries.
          for t in 15 45 90; do
            sleep $(( t - ${last:-0} )); last=$t
            xcrun simctl io "$device" screenshot "sim/ipad-${t}s.png"
          done
          cp ~/Library/Logs/DiagnosticReports/*Ink* sim/ 2>/dev/null || true
          # Still running? (a crash would have ended it)
          xcrun simctl spawn "$device" launchctl list | grep -i "com.biblestudy.app" | tee sim/running.txt
          tail -n 40 sim/stderr.txt || true
          test -s sim/running.txt

      - name: Keep the screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: sim/
          if-no-files-found: ignore

  # TestFlight (PLAT-7): when the version changes, builds the app for devices and sends it to
  # TestFlight. It runs only once the owner has added the Apple secrets below (an Apple Developer
  # account, the app made in App Store Connect with bundle id com.biblestudy.app, and an App Store
  # Connect API key with the App Manager role); without them it's skipped.
  #   APPLE_TEAM_ID             the 10-character team id
  #   ASC_KEY_ID, ASC_ISSUER_ID the API key's id and issuer id
  #   ASC_KEY_P8                the .p8 key file's contents
  testflight:
    needs: ios
    runs-on: macos-latest
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Is it set up, and did the version change?
        id: check
        run: |
          if [ -z "$TEAM" ]; then echo "No Apple secrets yet: skipping TestFlight."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet HEAD~1 HEAD -- app/build.gradle.kts && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Version unchanged: nothing to send."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.check.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.go == 'true'

      - name: Build and send to TestFlight
        if: steps.check.outputs.go == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_IOS_ID: ${{ secrets.GOOGLE_IOS_ID }}
        run: |
          chmod +x gradlew
          brew install xcodegen
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cd iosApp && xcodegen
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/InkAndWord.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.check.outputs.version }}" CURRENT_PROJECT_VERSION="${{ steps.check.outputs.code }}" \
            "${auth[@]}" archive | tail -n 40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/InkAndWord.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}" | tail -n 40
