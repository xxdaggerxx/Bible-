# Builds the signed APK and publishes it as a GitHub Release when a version tag (v2.0.0, ...) is pushed.
# APKs are too big to keep in the repository (GitHub's 100 MB file limit), so releases live here instead.
#
# The online Bible keys come from the repository's Actions secrets YOUVERSION_KEY, ESV_KEY and NLT_KEY
# (Settings -> Secrets and variables -> Actions). They are never written to the repository.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the online Bible keys are set
        env:
          YOUVERSION_KEY: ${{ secrets.YOUVERSION_KEY }}
          ESV_KEY: ${{ secrets.ESV_KEY }}
          NLT_KEY: ${{ secrets.NLT_KEY }}
        run: |
          missing=""
          [ -n "$YOUVERSION_KEY" ] || missing="$missing YOUVERSION_KEY"
          [ -n "$ESV_KEY" ] || missing="$missing ESV_KEY"
          [ -n "$NLT_KEY" ] || missing="$missing NLT_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions secrets:$missing. Add them in Settings -> Secrets and variables -> Actions, then run this workflow again."
            exit 1
          fi

      - name: Build the signed APK
        env:
          YOUVERSION_KEY: ${{ secrets.YOUVERSION_KEY }}
          ESV_KEY: ${{ secrets.ESV_KEY }}
          NLT_KEY: ${{ secrets.NLT_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          version="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "InkAndWord-$version.apk"
          ls -l InkAndWord-*.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Ink & Word ${{ env.TAG }}
          body: |
            Install **InkAndWord-*.apk** below on your Android tablet or phone (it updates over the installed app and keeps your notes).
            What's new is in the README under "New in version …".
          files: InkAndWord-*.apk
